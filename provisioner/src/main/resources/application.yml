spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/postgres
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    db:
      enabled: true
server:
  port: 8080

provisioner:
  services: ${BACKEND_SERVICES:order-service,inventory-service}
  tables:
    order-service: orders
    inventory-service: inventory

admin:
  token: ${ADMIN_TOKEN:}

cors:
  origins: ${CORS_ORIGINS:}