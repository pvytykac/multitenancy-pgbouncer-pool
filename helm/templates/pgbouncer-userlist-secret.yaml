apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgbouncer-pooling-demo.fullname" . }}-pgbouncer-userlist
  labels:
    {{- include "pgbouncer-pooling-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  userlist.txt: |
    "pgbouncer_auth" "{{ .Values.global.pgbouncerAuthPassword }}"
    "pgbouncer_admin" "{{ .Values.pgbouncer.adminPassword }}"
    "pgbouncer_exporter" "{{ .Values.pgbouncer.exporterPassword }}"