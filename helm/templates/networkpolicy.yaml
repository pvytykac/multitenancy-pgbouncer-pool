{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgbouncer-pooling-demo.fullname" . }}-backends-to-pgbouncer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgbouncer-pooling-demo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "pgbouncer-pooling-demo.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgbouncer-pooling-demo.fullname" . }}-provisioner-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgbouncer-pooling-demo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: provisioner
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgbouncer-pooling-demo.fullname" . }}-exporter-to-pgbouncer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgbouncer-pooling-demo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pgbouncer-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "pgbouncer-pooling-demo.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
---
apiVersion: networking.k8s.io/v1
