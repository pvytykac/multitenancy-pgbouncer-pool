apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgbouncer-pooling-demo.fullname" . }}-pgbouncer-config
  labels:
    {{- include "pgbouncer-pooling-demo.labels" . | nindent 4 }}
data:
  pgbouncer.ini: |
    [databases]
    * = host={{ .Release.Name }}-postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    auth_query = SELECT * FROM public.pgbouncer_get_auth($1)
    auth_user = pgbouncer_auth
    pool_mode = transaction
    default_pool_size = 5
    min_pool_size = 1
    reserve_pool_size = 0
    max_client_conn = 10000
    max_db_connections = 50
    server_idle_timeout = 60
    server_lifetime = 3600
    server_reset_query = DISCARD ALL
    ignore_startup_parameters = extra_float_digits,client_encoding
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_exporter