apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: pg-db-pooling-demo
build:
  artifacts:
    - image: backend-dummy
      context: .
      docker:
        dockerfile: backend-dummy/Dockerfile
    - image: provisioner
      context: .
      docker:
        dockerfile: provisioner/Dockerfile
    - image: frontend
      context: frontend
deploy:
  helm:
    releases:
      - name: demo
        chartPath: helm
        namespace: default
        createNamespace: true